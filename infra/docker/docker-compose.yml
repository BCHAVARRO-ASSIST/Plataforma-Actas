name: plataforma-actas

services:
  # 1. Base de datos PostgreSQL 17
  db:
    build:
      context: ../..
      dockerfile: database/Dockerfile
    container_name: plataforma-actas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plataforma_actas}
      POSTGRES_USER: ${POSTGRES_USER:-plataforma_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plataforma_dev_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plataforma_user} -d ${POSTGRES_DB:-plataforma_actas}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Migrador de esquema (EF Core Bundle)
  migrator:
    build:
      context: ../..
      dockerfile: tools/migrator/Dockerfile
    container_name: plataforma-actas-migrator
    environment:
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=${POSTGRES_DB:-plataforma_actas};Username=${POSTGRES_USER:-plataforma_user};Password=${POSTGRES_PASSWORD:-plataforma_dev_2026}"
    depends_on:
      db:
        condition: service_healthy

  # 3. Backend API ASP.NET Core 10
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: plataforma-actas-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=${POSTGRES_DB:-plataforma_actas};Username=${POSTGRES_USER:-plataforma_user};Password=${POSTGRES_PASSWORD:-plataforma_dev_2026}"
      Jwt__Key: ${JWT_KEY:-super-secret-key-32-chars-long-actas-2026-prod}
      Jwt__Issuer: ${JWT_ISSUER:-PlataformaActas.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-PlataformaActas.Web}
      Jwt__ExpiresMinutes: ${JWT_EXPIRES_MINUTES:-60}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost}
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-http://localhost}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - storage_documentos:/app/Storage/Documentos
    depends_on:
      migrator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 4. Frontend SPA (React + Vite + Nginx)
  web:
    build:
      context: ../..
      dockerfile: apps/web-admin/Dockerfile
    container_name: plataforma-actas-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  storage_documentos:
